spring.application.name=together

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/together}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:280590}
server.port=${PORT:8080}
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:root}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=${SPRING_MAIL_DEBUG:false}
app.confirmation.url=${APP_CONFIRMATION_URL:http://localhost:8080/api/auth/confirm?token=}

app.storage.bucket.name=${BUCKET_NAME:}
app.storage.bucket.endpoint=${AWS_ENDPOINT_URL_S3:}
app.storage.bucket.region=${AWS_REGION:us-east-1}
app.storage.bucket.access-key=${AWS_ACCESS_KEY_ID:}
app.storage.bucket.secret-key=${AWS_SECRET_ACCESS_KEY:}
app.storage.bucket.max-file-size-bytes=${PROFILE_IMAGE_MAX_FILE_SIZE_BYTES:5242880}
app.storage.bucket.url-duration-minutes=${PROFILE_IMAGE_URL_DURATION_MINUTES:15}

resend.mail.api.key= {RESEND_MAIL_API_KEY:}
