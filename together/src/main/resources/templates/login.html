<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Together - Login</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #121212; color: white; margin: 0; padding: 1.5rem; }
        .login-card { background: #1e1e1e; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 380px; }
        h2 { text-align: center; margin-bottom: 0.5rem; color: #00d4ff; }
        .subtitle { text-align: center; color: #9a9a9a; margin-bottom: 1.5rem; }
        input { width: 100%; padding: 0.85rem; margin: 0.6rem 0; border: 1px solid #333; border-radius: 8px; background: #2a2a2a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 0.9rem; background: #00d4ff; color: #121212; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 1rem; }
        button:hover { background: #00b8e6; }
        #message { margin-top: 1rem; text-align: center; font-size: 0.95rem; }
        .error { color: #ff8080; }
        .success { color: #7dffb2; }
        .footer-link { margin-top: 1.3rem; text-align: center; color: #bcbcbc; }
        .footer-link a { color: #00d4ff; text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
<div class="login-card">
    <h2>Together</h2>
    <p class="subtitle">Ingresá para ver viajes y gestionar tus reservas.</p>

    <form id="loginForm">
        <input type="email" id="email" placeholder="Tu email" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        <button type="submit">Iniciar sesión</button>
    </form>

    <div id="message"></div>
    <div class="footer-link">
        ¿Todavía no tenés cuenta? <a href="/register">Registrate</a>
    </div>
    <div class="footer-link">
        <a href="/forgot-password">¿Olvidaste tu contraseña?</a>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const messageDiv = document.getElementById('message');
        messageDiv.className = '';
        messageDiv.innerText = 'Autenticando...';

        const credentials = {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        };

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(credentials)
            });

            let data = null;
            const contentType = response.headers.get('content-type') || '';
            if (contentType.includes('application/json')) {
                data = await response.json();
            } else {
                const text = await response.text();
                data = { message: text };
            }

            if (response.ok) {
                localStorage.setItem('token', data.token);
                messageDiv.className = 'success';
                messageDiv.innerText = 'Login exitoso. Redirigiendo...';
                setTimeout(() => { window.location.href = '/home'; }, 1200);
            } else {
                messageDiv.className = 'error';
                messageDiv.innerText = data.message || 'Error: credenciales inválidas';
            }
        } catch (error) {
            console.error(error);
            messageDiv.className = 'error';
            messageDiv.innerText = 'Error de conexión con el servidor';
        }
    });
</script>
</body>
</html>
