<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Together - Registro</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #121212; color: white; margin: 0; padding: 1.5rem; }
        .register-card { background: #1e1e1e; padding: 2.3rem; border-radius: 18px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 560px; }
        h2 { text-align: center; margin-bottom: 0.5rem; color: #00d4ff; }
        .subtitle { text-align: center; color: #9a9a9a; margin-bottom: 1.5rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; }
        .full { grid-column: 1 / -1; }
        input, select { width: 100%; padding: 0.85rem; border: 1px solid #333; border-radius: 8px; background: #2a2a2a; color: white; box-sizing: border-box; }
        label { display: block; margin-bottom: 0.45rem; color: #bcbcbc; font-size: 0.92rem; }
        .field { margin-bottom: 0.9rem; }
        button { width: 100%; padding: 0.95rem; background: #00d4ff; color: #121212; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 0.4rem; }
        button:hover { background: #00b8e6; }
        #message { margin-top: 1rem; text-align: center; font-size: 0.95rem; }
        .error { color: #ff8080; }
        .success { color: #7dffb2; }
        .footer-link { margin-top: 1.3rem; text-align: center; color: #bcbcbc; }
        .footer-link a { color: #00d4ff; text-decoration: none; font-weight: 700; }
        @media (max-width: 640px) {
            .grid { grid-template-columns: 1fr; }
            .full { grid-column: auto; }
        }
    </style>
</head>
<body>
<div class="register-card">
    <h2>Crear cuenta</h2>
    <p class="subtitle">Completá tus datos para sumarte a Together.</p>

    <form id="registerForm">
        <div class="grid">
            <div class="field">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" required>
            </div>

            <div class="field">
                <label for="segundoNombre">Segundo nombre</label>
                <input type="text" id="segundoNombre">
            </div>

            <div class="field">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" required>
            </div>

            <div class="field">
                <label for="nroDocumento">Documento</label>
                <input type="text" id="nroDocumento" required>
            </div>

            <div class="field full">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="field">
                <label for="fechaNacimiento">Fecha de nacimiento</label>
                <input type="date" id="fechaNacimiento" required>
            </div>

            <div class="field">
                <label for="provincia">Provincia</label>
                <select id="provincia" required>
                    <option value="">Seleccioná una provincia</option>
                    <option value="BUENOS_AIRES">Buenos Aires</option>
                    <option value="CABA">CABA</option>
                    <option value="CATAMARCA">Catamarca</option>
                    <option value="CHACO">Chaco</option>
                    <option value="CHUBUT">Chubut</option>
                    <option value="CORDOBA">Córdoba</option>
                    <option value="CORRIENTES">Corrientes</option>
                    <option value="ENTRE_RIOS">Entre Ríos</option>
                    <option value="FORMOSA">Formosa</option>
                    <option value="JUJUY">Jujuy</option>
                    <option value="LA_PAMPA">La Pampa</option>
                    <option value="LA_RIOJA">La Rioja</option>
                    <option value="MENDOZA">Mendoza</option>
                    <option value="MISIONES">Misiones</option>
                    <option value="NEUQUEN">Neuquén</option>
                    <option value="RIO_NEGRO">Río Negro</option>
                    <option value="SALTA">Salta</option>
                    <option value="SAN_JUAN">San Juan</option>
                    <option value="SAN_LUIS">San Luis</option>
                    <option value="SANTA_CRUZ">Santa Cruz</option>
                    <option value="SANTA_FE">Santa Fe</option>
                    <option value="SANTIAGO_DEL_ESTERO">Santiago del Estero</option>
                    <option value="TIERRA_DEL_FUEGO">Tierra del Fuego</option>
                    <option value="TUCUMAN">Tucumán</option>
                </select>
            </div>

            <div class="field full">
                <label for="password">Contraseña</label>
                <input type="password" id="password" minlength="6" required>
            </div>
        </div>

        <button type="submit">Crear cuenta</button>
    </form>

    <div id="message"></div>
    <div class="footer-link">
        ¿Ya tenés cuenta? <a href="/login">Iniciá sesión</a>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const messageDiv = document.getElementById('message');
        messageDiv.className = '';
        messageDiv.innerText = 'Creando cuenta...';

        const payload = {
            nombre: document.getElementById('nombre').value.trim(),
            segundoNombre: document.getElementById('segundoNombre').value.trim() || null,
            apellido: document.getElementById('apellido').value.trim(),
            email: document.getElementById('email').value.trim(),
            nroDocumento: document.getElementById('nroDocumento').value.trim(),
            fechaNacimiento: document.getElementById('fechaNacimiento').value,
            provincia: document.getElementById('provincia').value,
            password: document.getElementById('password').value
        };

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const contentType = response.headers.get('content-type') || '';
            let message = '';

            if (contentType.includes('application/json')) {
                const data = await response.json();
                message = data.message || data.error || 'Operación completada.';
            } else {
                message = await response.text();
            }

            if (response.ok) {
                messageDiv.className = 'success';
                messageDiv.innerText = message || 'Cuenta creada. Revisá tu mail para activarla.';
                document.getElementById('registerForm').reset();
                return;
            }

            messageDiv.className = 'error';
            messageDiv.innerText = message || 'No se pudo crear la cuenta.';
        } catch (error) {
            console.error(error);
            messageDiv.className = 'error';
            messageDiv.innerText = 'Error de conexión con el servidor';
        }
    });
</script>
</body>
</html>
