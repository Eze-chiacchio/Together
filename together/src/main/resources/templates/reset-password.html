<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Together - Nueva contraseña</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #121212; color: white; margin: 0; padding: 1.5rem; }
        .card { background: #1e1e1e; padding: 2.4rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 420px; }
        h2 { text-align: center; margin-bottom: 0.5rem; color: #00d4ff; }
        .subtitle { text-align: center; color: #9a9a9a; margin-bottom: 1.5rem; }
        input { width: 100%; padding: 0.85rem; margin: 0.6rem 0; border: 1px solid #333; border-radius: 8px; background: #2a2a2a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 0.9rem; background: #00d4ff; color: #121212; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 1rem; }
        button:hover { background: #00b8e6; }
        #message { margin-top: 1rem; text-align: center; font-size: 0.95rem; }
        .error { color: #ff8080; }
        .success { color: #7dffb2; }
        .footer-link { margin-top: 1.3rem; text-align: center; color: #bcbcbc; }
        .footer-link a { color: #00d4ff; text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
<div class="card">
    <h2>Nueva contraseña</h2>
    <p class="subtitle">Elegí una nueva contraseña para tu cuenta.</p>

    <form id="resetPasswordForm">
        <input type="password" id="newPassword" placeholder="Nueva contraseña" minlength="6" required>
        <input type="password" id="confirmPassword" placeholder="Repetí la nueva contraseña" minlength="6" required>
        <button type="submit">Guardar contraseña</button>
    </form>

    <div id="message"></div>
    <div class="footer-link">
        <a href="/login">Volver al login</a>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const messageDiv = document.getElementById('message');
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!token) {
            messageDiv.className = 'error';
            messageDiv.innerText = 'El enlace de recuperación es inválido.';
            return;
        }

        if (newPassword !== confirmPassword) {
            messageDiv.className = 'error';
            messageDiv.innerText = 'Las contraseñas no coinciden.';
            return;
        }

        messageDiv.className = '';
        messageDiv.innerText = 'Actualizando contraseña...';

        try {
            const response = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, newPassword })
            });

            const text = await response.text();
            messageDiv.className = response.ok ? 'success' : 'error';
            messageDiv.innerText = text;

            if (response.ok) {
                document.getElementById('resetPasswordForm').reset();
            }
        } catch (error) {
            console.error(error);
            messageDiv.className = 'error';
            messageDiv.innerText = 'Error de conexión con el servidor';
        }
    });
</script>
</body>
</html>
