<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Together - Solicitudes Recibidas</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; margin: 0; padding: 2rem; }
        .page { max-width: 1100px; margin: 0 auto; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .title { margin: 0; color: #00d4ff; }
        .logout-btn { background: transparent; color: white; border: 1px solid #3a3a3a; border-radius: 999px; padding: 0.7rem 1rem; cursor: pointer; }
        .logout-btn:hover { border-color: #00d4ff; color: #00d4ff; }
        .back-link { color: #8c8c8c; text-decoration: none; display: inline-block; margin-bottom: 1.5rem; }
        .list { display: grid; gap: 1rem; }
        .card { background: linear-gradient(160deg, #1f1f1f, #161616); border: 1px solid #2f2f2f; border-radius: 18px; padding: 1.25rem; box-shadow: 0 16px 40px rgba(0,0,0,0.25); }
        .card-header { display: flex; justify-content: space-between; gap: 1rem; align-items: flex-start; margin-bottom: 1rem; }
        .route { font-size: 1.5rem; font-weight: 800; margin: 0; }
        .subtitle { color: #9ddfff; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.4rem; }
        .status { padding: 0.45rem 0.75rem; border-radius: 999px; font-weight: 800; font-size: 0.8rem; text-transform: uppercase; }
        .status-pendiente { background: #ffe082; color: #322400; }
        .status-aceptada { background: #7dffb2; color: #123022; }
        .status-rechazada { background: #ff8a80; color: #3e1713; }
        .content { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(220px, 1fr); gap: 1rem; }
        .passenger { display: flex; gap: 1rem; align-items: center; padding: 1rem; background: #181818; border: 1px solid #2a2a2a; border-radius: 16px; }
        .avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: #2f2f2f; border: 2px solid #303030; }
        .avatar-fallback { width: 64px; height: 64px; border-radius: 50%; background: #00d4ff; color: #121212; display: inline-flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 800; }
        .name { font-size: 1.1rem; font-weight: 800; }
        .meta { color: #b8b8b8; margin-top: 0.25rem; }
        .trip-grid { display: grid; grid-template-columns: repeat(2, minmax(140px, 1fr)); gap: 0.8rem; }
        .trip-box { background: #181818; border: 1px solid #2a2a2a; border-radius: 14px; padding: 0.9rem; }
        .trip-label { display: block; color: #8a8a8a; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.35rem; }
        .trip-value { font-weight: 700; }
        .actions { display: flex; gap: 0.75rem; margin-top: 1rem; flex-wrap: wrap; }
        .btn { border: none; border-radius: 999px; padding: 0.85rem 1.1rem; font-weight: 800; cursor: pointer; }
        .btn-accept { background: #7dffb2; color: #123022; }
        .btn-reject { background: #ff8a80; color: #3e1713; }
        .btn-secondary { background: transparent; color: #e0e0e0; border: 1px solid #3a3a3a; text-decoration: none; display: inline-flex; align-items: center; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .message { margin-top: 0.9rem; font-weight: 700; }
        .message.success { color: #7dffb2; }
        .message.error { color: #ff8a80; }
        .empty, .error { background: #1d1d1d; border: 1px solid #2e2e2e; border-radius: 18px; padding: 1.25rem; color: #d0d0d0; }
        @media (max-width: 820px) {
            .content { grid-template-columns: 1fr; }
            .trip-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
<div class="page">
    <div class="topbar">
        <h1 class="title">Solicitudes recibidas</h1>
        <button class="logout-btn" onclick="logout()">Cerrar sesión</button>
    </div>

    <a class="back-link" href="/home">← Volver al inicio</a>

    <div id="errorBox" class="error" style="display: none;">No se pudieron cargar las solicitudes.</div>
    <div id="emptyBox" class="empty" style="display: none;">Todavía no recibiste solicitudes para tus viajes.</div>
    <div id="reservasList" class="list"></div>
</div>

<script>
    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function initials(nombre, apellido) {
        return `${(nombre || '').trim().charAt(0)}${(apellido || '').trim().charAt(0)}`.toUpperCase() || '?';
    }

    function formatEstado(estado) {
        return estado.charAt(0) + estado.slice(1).toLowerCase();
    }

    function statusClass(estado) {
        return `status status-${estado.toLowerCase()}`;
    }

    function renderAvatar(url, nombre, apellido) {
        if (url) {
            return `<img class="avatar" src="${escapeHtml(url)}" alt="Foto de ${escapeHtml(nombre)} ${escapeHtml(apellido)}">`;
        }

        return `<span class="avatar-fallback">${escapeHtml(initials(nombre, apellido))}</span>`;
    }

    function renderReserva(reserva) {
        const canManage = reserva.estado === 'PENDIENTE';

        return `
            <article class="card" id="reserva-${reserva.id}">
                <div class="card-header">
                    <div>
                        <div class="subtitle">Solicitud para tu viaje</div>
                        <h2 class="route">${escapeHtml(reserva.ciudadOrigen)} → ${escapeHtml(reserva.ciudadDestino)}</h2>
                    </div>
                    <span class="${statusClass(reserva.estado)}">${escapeHtml(formatEstado(reserva.estado))}</span>
                </div>

                <div class="content">
                    <div class="passenger">
                        ${renderAvatar(reserva.pasajeroProfileImageUrl, reserva.pasajeroNombre, reserva.pasajeroApellido)}
                        <div>
                            <div class="name">${escapeHtml(reserva.pasajeroNombre)} ${escapeHtml(reserva.pasajeroApellido)}</div>
                            <div class="meta">${escapeHtml(reserva.pasajeroEmail)}</div>
                        </div>
                    </div>

                    <div class="trip-grid">
                        <div class="trip-box">
                            <span class="trip-label">Horario del viaje</span>
                            <span class="trip-value">${new Date(reserva.horarioEstimado).toLocaleString()}</span>
                        </div>
                        <div class="trip-box">
                            <span class="trip-label">Cupos restantes</span>
                            <span class="trip-value">${escapeHtml(reserva.cuposDisponibles)}</span>
                        </div>
                        <div class="trip-box">
                            <span class="trip-label">Solicitud enviada</span>
                            <span class="trip-value">${new Date(reserva.fechaSolicitud).toLocaleString()}</span>
                        </div>
                        <div class="trip-box">
                            <span class="trip-label">Detalle del viaje</span>
                            <a class="btn btn-secondary" href="/viajes/${reserva.viajeId}">Abrir viaje</a>
                        </div>
                    </div>
                </div>

                <div class="actions">
                    <button class="btn btn-accept" ${canManage ? '' : 'disabled'} onclick="resolverReserva(${reserva.id}, 'aceptar')">Aceptar</button>
                    <button class="btn btn-reject" ${canManage ? '' : 'disabled'} onclick="resolverReserva(${reserva.id}, 'rechazar')">Rechazar</button>
                </div>

                <div id="message-${reserva.id}" class="message"></div>
            </article>
        `;
    }

    async function cargarSolicitudes() {
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login';
            return;
        }

        try {
            const response = await fetch('/api/reservas/recibidas', {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (response.status === 401 || response.status === 403) {
                logout();
                return;
            }

            if (!response.ok) {
                throw new Error('No se pudieron cargar las solicitudes');
            }

            const reservas = await response.json();
            const list = document.getElementById('reservasList');

            if (!reservas.length) {
                document.getElementById('emptyBox').style.display = 'block';
                return;
            }

            list.innerHTML = reservas.map(renderReserva).join('');
        } catch (error) {
            console.error(error);
            document.getElementById('errorBox').style.display = 'block';
        }
    }

    async function resolverReserva(reservaId, accion) {
        const token = localStorage.getItem('token');
        const message = document.getElementById(`message-${reservaId}`);
        const card = document.getElementById(`reserva-${reservaId}`);
        const buttons = card.querySelectorAll('button');

        buttons.forEach(button => button.disabled = true);
        message.className = 'message';
        message.innerText = accion === 'aceptar' ? 'Aceptando solicitud...' : 'Rechazando solicitud...';

        try {
            const response = await fetch(`/api/reservas/${reservaId}/${accion}`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.status === 401 || response.status === 403) {
                logout();
                return;
            }

            let body = null;
            const contentType = response.headers.get('content-type') || '';
            if (contentType.includes('application/json')) {
                body = await response.json();
            }

            if (!response.ok) {
                const errorText = body?.message || body?.error || `No se pudo ${accion} la solicitud.`;
                message.className = 'message error';
                message.innerText = errorText;
                buttons.forEach(button => {
                    if (button.classList.contains('btn-secondary')) {
                        return;
                    }
                    button.disabled = false;
                });
                return;
            }

            message.className = 'message success';
            message.innerText = accion === 'aceptar'
                ? 'Solicitud aceptada con éxito.'
                : 'Solicitud rechazada con éxito.';

            const status = card.querySelector('.status');
            status.className = statusClass(body.estado);
            status.innerText = formatEstado(body.estado);

            const cuposBox = Array.from(card.querySelectorAll('.trip-box')).find(box =>
                box.querySelector('.trip-label').innerText === 'Cupos restantes'
            );
            if (cuposBox) {
                cuposBox.querySelector('.trip-value').innerText = body.cuposDisponibles;
            }

            buttons.forEach(button => {
                if (button.classList.contains('btn-secondary')) {
                    return;
                }
                button.disabled = true;
            });
        } catch (error) {
            console.error(error);
            message.className = 'message error';
            message.innerText = 'Error de conexión al actualizar la solicitud.';
            buttons.forEach(button => {
                if (button.classList.contains('btn-secondary')) {
                    return;
                }
                button.disabled = false;
            });
        }
    }

    function logout() {
        localStorage.removeItem('token');
        window.location.href = '/login';
    }

    document.addEventListener('DOMContentLoaded', cargarSolicitudes);
</script>
</body>
</html>
